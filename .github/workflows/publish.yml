name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          gleam-version: "1.16.0"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
